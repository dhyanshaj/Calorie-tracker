services:
  app:
    build: .
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: production
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:?Set your actual HTTPS app URL}
      TRUST_PROXY_HOPS: 1
      DATABASE_PATH: /app/.data/platewise.sqlite
      BACKUP_DIR: /app/.backups
    expose:
      - "3000"
    volumes:
      - app_data:/app/.data
      - app_backups:/app/.backups
  web:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - app
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Set your actual domain hostname}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
volumes:
  app_data:
  app_backups:
  caddy_data:
  caddy_config:
